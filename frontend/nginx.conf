server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  client_max_body_size 10m;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # Docker's embedded DNS. Using a variable makes nginx re-resolve "backend" so a
  # restarted API container (new IP) never causes lasting 502s.
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $api http://backend:8080;

  # API + signed media go to the Go backend (same origin => no CORS, works inside Telegram).
  location /api/ {
    proxy_pass $api;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_read_timeout 75s;
  }
  location /media/ {
    proxy_pass $api;
    proxy_set_header Host $host;
  }
  location = /healthz { proxy_pass $api; }

  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri /index.html;
  }
}
