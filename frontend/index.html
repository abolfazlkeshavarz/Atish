<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#FF3B5C" />
    <title>Atish</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <!-- Load the Telegram SDK only inside Telegram (it signals via URL hash / webview proxy), so web users never wait on it -->
    <script>
      (function () {
        try {
          var h = location.hash + (sessionStorage.getItem("__telegram__initParams") || "");
          if (h.indexOf("tgWebApp") !== -1 || window.TelegramWebviewProxy) {
            document.write('<script src="https://telegram.org/js/telegram-web-app.js"><' + '/script>');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
