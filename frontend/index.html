<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#FF3B5C" />
    <title>Atish</title>
    <link rel="icon" href="/favicon.png" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Non-blocking: where Google Fonts is slow or filtered the app must still paint (system font fallback) -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" media="print" onload="this.media='all'" />
    <!-- Telegram SDK: only inside Telegram, and never parser-blocking. telegram.org is unreachable on some networks
         (e.g. Telegram running through a proxy the webview doesn't use), so sign-in must not depend on this script:
         src/platform/telegram.ts reads the signed launch data straight from the URL and uses the SDK only for extras. -->
    <script>
      (function () {
        try {
          var h = location.hash + (sessionStorage.getItem("__telegram__initParams") || "");
          if (h.indexOf("tgWebApp") !== -1 || window.TelegramWebviewProxy) {
            var s = document.createElement("script");
            s.src = "https://telegram.org/js/telegram-web-app.js";
            s.async = true;
            s.onload = function () { window.dispatchEvent(new Event("tg-sdk-ready")); };
            document.head.appendChild(s);
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
